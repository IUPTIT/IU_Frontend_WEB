services:
  web:
    build:
      context: .
      target: runner
      args:
        # VITE_API_URL nhúng vào bundle lúc build — đổi thì phải build lại
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3456/api/v1}
    container_name: iu_club_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4173}:4173"
